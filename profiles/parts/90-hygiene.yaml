
  # --- Repository hygiene ---------------------------------------------------
  # The one non-Docker block. These are pure Python and the runner builds them an
  # isolated, cached environment: nothing is installed on the machine or on PATH.
  # `prek` executes most of them as native Rust with no environment at all.
  # Safe to delete: gitleaks already covers the private-key case.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
