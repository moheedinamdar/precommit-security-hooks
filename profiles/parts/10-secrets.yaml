      # --- Secrets ---------------------------------------------------------
      - id: gitleaks
        name: "gitleaks · secrets in changed files"
        description: Offline secret detection over the files being committed.
        # `dir` and not `git`: the container runs as the host uid, so git refuses the
        # bind-mounted repo ("dubious ownership"), gitleaks falls back to --no-index
        # and EXITS 0, a scanner that silently passes. Filenames come from the
        # runner instead, which is also faster. See the README's Troubleshooting.
        entry: ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner
        language: docker_image
        types: [text]

      - id: trufflehog
        name: "trufflehog · live credential verification"
        description: >-
          Confirms whether a detected credential is actually live. Runs on push, not
          on commit: it is slow and it sends candidate secrets to vendor APIs. Only
          verified and indeterminate results fail the push. Add --no-verification
          for an offline (and much noisier) run.
        entry: trufflesecurity/trufflehog:3.97.4 git file:///src --max-depth=50 --results=verified,unknown --fail --no-update
        language: docker_image
        pass_filenames: false
        stages: [pre-push]
